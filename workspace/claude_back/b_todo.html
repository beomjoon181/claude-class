<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할 일</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 80px 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #fdf2f8 100%);
            color: #1f2937;
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 32px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(99, 102, 241, 0.12);
        }

        h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
        .count { margin: 6px 0 24px; font-size: 14px; color: #9ca3af; }

        form { display: flex; gap: 8px; margin-bottom: 20px; }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 12px 16px;
            border: 1.5px solid #e5e7eb;
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: #6366f1; }

        button {
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s, color 0.2s;
        }
        .add {
            padding: 0 20px;
            border-radius: 14px;
            background: #6366f1;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
        }
        .add:hover { background: #4f46e5; }

        ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 14px;
            background: #f9fafb;
        }

        .check {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            border: 2px solid #d1d5db;
            border-radius: 50%;
        }
        li.done .check { border-color: #6366f1; background: #6366f1; }

        .text { flex: 1; min-width: 0; cursor: pointer; word-break: break-all; }
        li.done .text { text-decoration: line-through; color: #9ca3af; }

        li input[type="text"] { padding: 6px 10px; border-radius: 10px; font-size: 15px; }

        .btn {
            flex-shrink: 0;
            padding: 6px 10px;
            border-radius: 10px;
            background: transparent;
            color: #9ca3af;
            font-size: 13px;
        }
        .btn:hover { background: #eef2ff; color: #6366f1; }
        .btn.delete:hover { background: #fef2f2; color: #ef4444; }

        .empty { padding: 32px 0; text-align: center; color: #9ca3af; font-size: 14px; }
    </style>
</head>
<body>
    <main class="card">
        <h1>할 일</h1>
        <p class="count" id="count"></p>

        <form id="form">
            <input type="text" id="input" placeholder="할 일을 입력하세요" required>
            <button type="submit" class="add">추가</button>
        </form>

        <ul id="list"></ul>
    </main>

    <script>
        const API = "http://localhost:10000/todo"

        const form = document.getElementById("form")
        const input = document.getElementById("input")
        const list = document.getElementById("list")
        const count = document.getElementById("count")

        let todos = []

        // 서버 요청 공통 함수
        async function request(url, method = "GET", body) {
            const res = await fetch(url, {
                method,
                headers: { "Content-Type": "application/json" },
                body: body && JSON.stringify(body),
            })
            return res.json()
        }

        // 목록 그리기
        function render() {
            list.innerHTML = ""
            const left = todos.filter((t) => !t.done).length
            count.textContent = `남은 할 일 ${left}개 / 전체 ${todos.length}개`

            if (todos.length === 0) {
                list.innerHTML = `<p class="empty">할 일이 없어요 🎉</p>`
                return
            }

            todos.forEach((todo) => {
                const li = document.createElement("li")
                if (todo.done) li.classList.add("done")

                const check = document.createElement("span")
                check.className = "check"

                const text = document.createElement("span")
                text.className = "text"
                text.textContent = todo.text

                const editBtn = document.createElement("button")
                editBtn.className = "btn"
                editBtn.textContent = "수정"

                const deleteBtn = document.createElement("button")
                deleteBtn.className = "btn delete"
                deleteBtn.textContent = "삭제"

                // 완료 토글 (클릭하면 line-through)
                check.onclick = text.onclick = () => toggleTodo(todo)
                editBtn.onclick = () => startEdit(li, text, todo)
                deleteBtn.onclick = () => deleteTodo(todo.id)

                li.append(check, text, editBtn, deleteBtn)
                list.append(li)
            })
        }

        // 조회
        async function loadTodos() {
            todos = await request(API)
            render()
        }

        // 추가
        form.onsubmit = async (e) => {
            e.preventDefault()
            const text = input.value.trim()
            if (!text) return

            const todo = await request(API, "POST", { text })
            todos.push(todo)
            input.value = ""
            render()
        }

        // 완료 여부 변경
        async function toggleTodo(todo) {
            const updated = await request(`${API}/${todo.id}`, "PATCH", { done: !todo.done })
            Object.assign(todo, updated)
            render()
        }

        // 수정 (텍스트를 입력창으로 바꿔서 Enter: 저장, Esc: 취소)
        function startEdit(li, text, todo) {
            const editInput = document.createElement("input")
            editInput.type = "text"
            editInput.value = todo.text
            text.replaceWith(editInput)
            editInput.focus()

            const editBtn = li.querySelector(".btn")
            editBtn.textContent = "저장"
            editBtn.onclick = () => saveEdit(todo, editInput.value)

            editInput.onkeydown = (e) => {
                if (e.key === "Enter") saveEdit(todo, editInput.value)
                if (e.key === "Escape") render()
            }
        }

        async function saveEdit(todo, value) {
            const text = value.trim()
            if (text && text !== todo.text) {
                const updated = await request(`${API}/${todo.id}`, "PATCH", { text })
                Object.assign(todo, updated)
            }
            render()
        }

        // 삭제
        async function deleteTodo(id) {
            await request(`${API}/${id}`, "DELETE")
            todos = todos.filter((t) => t.id !== id)
            render()
        }

        loadTodos()
    </script>
</body>
</html>
