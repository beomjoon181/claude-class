<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리스트</title>
</head>
<body>
    <!-- ul: 순서가 없는 목록을 만드는 태그 (각 항목 앞에 점 표시) -->
    <ul>
        <!-- li: 목록의 각 항목을 나타내는 태그 -->
        <li>사과</li>
        <li>바나나</li>
        <li>포도</li>
    </ul>
    <!-- ol: 순서가 있는 목록을 만드는 태그 (각 항목 앞에 번호 표시) -->
    <ol>
        <li>첫 번째 단계</li>
        <li>두 번째 단계</li>
        <li>세 번째 단계</li>
    </ol>
</body>
</html>
